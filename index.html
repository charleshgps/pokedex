<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- LINKS -->
    <link rel="icon" href="./favicons/favicon-16x16.png">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/media.css">
    <link rel="stylesheet" href="./css/battle.css">
    <!-- SCRIPT -->
    <script defer src="./js/type-colors.js"></script>
    <script defer src="./js/script.js"></script>
    <script defer src="./js/battle.js"></script>
    <title>Pokedex</title>
</head>

<body>
    <main>
        <div class="fun_toolbar">
            <button type="button" class="icon-btn btn-shiny" title="Alternar sprite shiny">✨</button>
            <button type="button" class="icon-btn btn-sound" title="Ativar/desativar som">🔊</button>
        </div>
        <div class="pokemon_types">
            <span class="pokemon_type0"></span>
            <span class="pokemon_type1"></span>
        </div>
        <img src="" alt="pokemon" class="pokemon_image">
        <h1 class="pokemon_data">
            <span class="pokemon_number"> </span> -
            <span class="pokemon_name"> </span>
        </h1>

        <form class="form">
            <input type="search" class="input_search" placeholder="&#128269; Search by name or number" required />
            <table class="table">
                <tr>
                    <th>HP</th>
                    <th>ATK</th>
                    <th>DEF</th>
                    <th>S ATK</th>
                    <th>S DEF</th>
                    <th>SPD</th>
                </tr>
                <tr>
                    <td><span class="hp"></span></td>
                    <td><span class="atk"></span></td>
                    <td><span class="def"></span></td>
                    <td><span class="satk"></span></td>
                    <td><span class="sdef"></span></td>
                    <td><span class="spd"></span></td>
                </tr>
            </table>
        </form>
        <div class="buttons">
            <button class="button btn-prev"> &lt Prev </button>
            <button class="button btn-next"> Next &gt </button>
        </div>


        <img src="./images/pokedex.png" alt="Pokedex" class="pokedex">
    </main>

    <div class="mode-toggle">
        <button type="button" class="button btn-mode-battle" id="toggleBattle">⚔️ Modo Batalha</button>
    </div>

    <section class="battle-arena" id="battleArena">
        <h2 class="battle-title">Arena de Batalha ⚔️</h2>

        <div class="fighters-row">
            <div class="fighter-picker">
                <form class="fighter-form" id="fighter1Form">
                    <input type="search" class="battle-input" id="fighter1Input" placeholder="Pokémon 1" required>
                    <button type="submit" class="button btn-load">Carregar</button>
                </form>
                <div class="fighter-card" id="fighter1Card">
                    <p class="fighter-placeholder">Escolha o primeiro lutador</p>
                </div>
            </div>

            <span class="vs-badge">VS</span>

            <div class="fighter-picker">
                <form class="fighter-form" id="fighter2Form">
                    <input type="search" class="battle-input" id="fighter2Input" placeholder="Pokémon 2" required>
                    <button type="submit" class="button btn-load">Carregar</button>
                </form>
                <div class="fighter-card" id="fighter2Card">
                    <p class="fighter-placeholder">Escolha o segundo lutador</p>
                </div>
            </div>
        </div>

        <button type="button" class="button btn-fight" id="fightButton" disabled>Lutar! 🔥</button>

        <div class="battle-log" id="battleLog"></div>
    </section>
</body>

</html>
